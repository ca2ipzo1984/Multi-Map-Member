    <div class="brand-title-text">📍 U-Nhai</div>
  </div>

  <div class="profile-card">
    <div class="profile-info">
      <img id="userAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar-lg" referrerpolicy="no-referrer">
      <div>
        <div class="profile-name" id="userName">กำลังเชื่อมต่อ LINE...</div>
        <div class="profile-sub">ศูนย์บัญชาการแผนที่แก๊งสด</div>
      </div>
    </div>
  </div>

  <div class="project-grid" id="projectList">
    <div style="text-align:center; color:#64748b; padding:40px 0;">
      ยังไม่มีแผนที่กลุ่ม<br>กดปุ่มสีเขียวด้านล่างเพื่อสร้างโปรเจกต์ใหม่!
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-create-main" id="btnOpenCreate">
      <span>➕</span> สร้างแผนที่กลุ่มใหม่
    </button>
  </div>

  <div id="modalCreate">
    <div class="modal-box">
      <div class="modal-title">🚩 สร้างแผนที่กลุ่มใหม่</div>
      <input type="text" class="modal-input" id="roomNameInput" placeholder="เช่น ทริปเขาใหญ่ 2026, ทีมไรเดอร์" maxlength="30">
      <div class="modal-buttons">
        <button class="btn-modal btn-modal-cancel" id="btnCancelModal">ยกเลิก</button>
        <button class="btn-modal btn-modal-ok" id="btnConfirmCreate">สร้างห้องทันที</button>
      </div>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2012010620-7LrsLOGx";

    // ระบบตรวจจับภาษาเริ่มต้นของเครื่อง (Default Device Language Detection)
    const deviceLang = (navigator.language || navigator.userLanguage || 'th').toLowerCase();
    const isThai = deviceLang.startsWith('th');

    const i18n = {
      title: isThai ? '🗂️ U-Nhai' : '🗂️ U-Nhai',
      hqSub: isThai ? 'ศูนย์บัญชาการแผนที่แก๊งสด' : 'Squad Live GPS Command Hub',
      connecting: isThai ? 'กำลังเชื่อมต่อ LINE...' : 'Connecting to LINE...',
      noProjects: isThai ? 'ยังไม่มีแผนที่กลุ่ม<br>กดปุ่มสีเขียวด้านล่างเพื่อสร้างห้องแรกได้เลย!' : 'No squad maps yet<br>Tap green button below to create your first room!',
      btnCreate: isThai ? 'สร้างแผนที่กลุ่มใหม่' : 'Create New Squad Map',
      modalTitle: isThai ? '🚩 สร้างแผนที่กลุ่มใหม่' : '🚩 Create New Squad Map',
      modalPlaceholder: isThai ? 'เช่น ทริปเขาใหญ่ 2026, ทีมไรเดอร์' : 'e.g. Roadtrip 2026, Delivery Squad',
      modalCancel: isThai ? 'ยกเลิก' : 'Cancel',
      modalOk: isThai ? 'สร้างห้องทันที' : 'Create Now',
      createdLabel: isThai ? 'สร้างเมื่อ:' : 'Created:',
      byLabel: isThai ? 'โดย' : 'by',
      btnEnter: isThai ? '🗺️ เข้าแผนที่' : '🗺️ Open Map',
      btnShare: isThai ? '📤 แชร์เข้า LINE' : '📤 Share to LINE',
      confirmDel: isThai ? 'ต้องการลบแผนที่ห้องนี้ออกจากรายการของคุณใช่หรือไม่?' : 'Do you want to delete this room from your list?',
      pleaseName: isThai ? 'กรุณาตั้งชื่อแผนที่กลุ่มก่อน!' : 'Please enter a squad map name!',
      createSuccess: isThai ? 'สร้างแผนที่' : 'Squad Map',
      done: isThai ? 'สำเร็จ!' : 'Created successfully!',
      roomCode: isThai ? 'รหัสห้อง:' : 'Room Code:',
      copied: isThai ? 'คัดลอกลิงก์ห้องเรียบร้อย!' : 'Room link copied!',
      defaultUser: isThai ? 'สหาย' : 'Friend'
    };

    document.title = i18n.title;
    document.querySelector('.profile-sub').textContent = i18n.hqSub;
    document.getElementById('btnOpenCreate').innerHTML = '<span>➕</span> ' + i18n.btnCreate;
    document.querySelector('.modal-title').textContent = i18n.modalTitle;
    document.getElementById('roomNameInput').placeholder = i18n.modalPlaceholder;
    document.getElementById('btnCancelModal').textContent = i18n.modalCancel;
    document.getElementById('btnConfirmCreate').textContent = i18n.modalOk;


    let myProfile = {
      userId: localStorage.getItem("SQUAD_UID") || "",
      name: localStorage.getItem("SQUAD_UNAME") || i18n.defaultUser,
      avatar: localStorage.getItem("SQUAD_UAVATAR") || "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };

    async function initDashboardLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const p = await liff.getProfile();
          myProfile.userId = p.userId;
          myProfile.name = p.displayName;
          myProfile.avatar = p.pictureUrl || myProfile.avatar;

          localStorage.setItem("SQUAD_UID", myProfile.userId);
          localStorage.setItem("SQUAD_UNAME", myProfile.name);
          localStorage.setItem("SQUAD_UAVATAR", myProfile.avatar);

          document.getElementById("userName").textContent = myProfile.name;
          document.getElementById("userAvatar").src = myProfile.avatar;
        } else {
          liff.login();
        }
      } catch (e) {
        console.warn("LIFF Dashboard fallback:", e);
        document.getElementById("userName").textContent = myProfile.name;
      }
      renderProjects();
    }
    initDashboardLiff();

    function getStoredProjects() {
      return JSON.parse(localStorage.getItem("SQUAD_PROJECTS") || "[]");
    }

    function saveProjects(list) {
      localStorage.setItem("SQUAD_PROJECTS", JSON.stringify(list));
      renderProjects();
    }

    function renderProjects() {
      const list = getStoredProjects();
      const container = document.getElementById("projectList");
      document.getElementById("projectCount").textContent = `${list.length} ห้อง`;

      if (!list.length) {
        container.innerHTML = `
          <div style="text-align:center; color:#64748b; padding:40px 0;">
            ${i18n.noProjects}
          </div>`;
        return;
      }

      container.innerHTML = "";
      list.forEach((p, idx) => {
        const shareLink = `https://liff.line.me/${MY_LIFF_ID}?room=${p.roomId}`;
        const enterLink = `LiffMap.html?room=${p.roomId}`;

        const card = document.createElement("div");
        card.className = "project-card";
        card.innerHTML = `
          <div class="card-top">
            <div class="project-name">${p.name}</div>
            <div class="room-badge">${p.roomId}</div>
          </div>
          <div class="card-meta">📅 ${i18n.createdLabel} ${p.createdAt} (${i18n.byLabel} ${p.creator})</div>
          <div class="card-actions">
            <a href="${enterLink}" class="btn-action btn-enter">${i18n.btnEnter}</a>
            <button class="btn-action btn-share" onclick="shareProject('${p.name}', '${p.roomId}')">${i18n.btnShare}</button>
            <button class="btn-action btn-del" onclick="deleteProject(${idx})" title="ลบห้องนี้">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const modal = document.getElementById("modalCreate");
    const nameInput = document.getElementById("roomNameInput");

    document.getElementById("btnOpenCreate").onclick = () => {
      modal.style.display = "flex";
      nameInput.value = "";
      nameInput.focus();
    };
    document.getElementById("btnCancelModal").onclick = () => {
      modal.style.display = "none";
    };

    document.getElementById("btnConfirmCreate").onclick = () => {
      const name = nameInput.value.trim();
      if (!name) {
        alert(i18n.pleaseName);
        return;
      }

      const roomId = "ROOM-" + Math.floor(1000 + Math.random() * 9000);
      const nowStr = isThai
        ? new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })
        : new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

      const newProj = {
        roomId: roomId,
        name: name,
        creator: myProfile.name,
        createdAt: nowStr
      };

      const currentList = getStoredProjects();
      currentList.unshift(newProj);
      saveProjects(currentList);

      modal.style.display = "none";
      alert(`✅ ${i18n.createSuccess} [${name}] ${i18n.done}\n${i18n.roomCode} ${roomId}`);
    };

        window.shareProject = (name, roomId) => {
      const shareUrl = `https://liff.line.me/${MY_LIFF_ID}?room=${roomId}`;
      if (typeof liff !== "undefined" && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([
          {
            type: "flex",
            altText: `📍 ${name}`,
            contents: {
              type: "bubble",
              size: "kilo",
              header: {
                type: "box",
                layout: "horizontal",
                backgroundColor: "#0f172a",
                contents: [
                  { type: "text", text: "📍 U-Nhai", weight: "bold", color: "#06c755", size: "sm" },
                  { type: "text", text: roomId, weight: "bold", color: "#38bdf8", size: "xxs", align: "end" }
                ]
              },
              body: {
                type: "box",
                layout: "vertical",
                backgroundColor: "#1e293b",
                spacing: "md",
                contents: [
                  { type: "text", text: name, weight: "bold", size: "lg", color: "#ffffff" },
                  { type: "text", text: isThai ? "🗺️ ชวนเข้าดูพิกัดสดและตำแหน่งแก๊งแบบเรียลไทม์" : "🗺️ Realtime live squad GPS tracking", size: "xs", color: "#94a3b8" }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                backgroundColor: "#0f172a",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#06c755",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "🚗 เข้าดูแผนที่สด",
                      uri: shareUrl
                    }
                  }
                ]
              }
            }
          }
        ]);
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert(i18n.copied);
      }
    };

    window.deleteProject = (index) => {
      if (confirm(i18n.confirmDel)) {
        const list = getStoredProjects();
        list.splice(index, 1);
        saveProjects(list);
      }
    };
  </script>
</body>
</html>
