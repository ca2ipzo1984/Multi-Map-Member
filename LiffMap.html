<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🗺️ LINE SQUAD LIVE MAP // แผนที่แก๊งสด</title>

  <!-- 1. LINE LIFF SDK 2.x -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 2. แผนที่ Leaflet (OpenStreetMap ฟรี 100% ไม่ติด API Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* ป้ายหัวด้านบน */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
    }
    .user-profile-badge { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .user-avatar-mini { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #06c755; object-fit: cover; }

    /* ปุ่มลอย */
    .fab-group { position: absolute; right: 12px; top: 65px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .btn-fab {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid #475569;
      background: #1e293b; color: #fff; font-size: 1.2rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    }
    .btn-fab.active { background: #ef4444; border-color: #fff; }

    /* แดชบอร์ดด้านล่าง */
    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
      padding: 10px 14px; border-radius: 16px 16px 0 0; max-height: 200px;
    }
    .target-box {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
      border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .member-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .member-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 6px 8px; min-width: 120px; font-size: 0.72rem; flex-shrink: 0;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .member-card.is-me { border-color: #06c755; background: rgba(6, 199, 85, 0.15); }
    .member-card-img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }

    /* หมุดโปรไฟล์บนแผนที่ */
    .line-user-pin { text-align: center; }
    .pin-img {
      width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #06c755;
      box-shadow: 0 0 12px rgba(6,199,85,0.8); object-fit: cover; background: #000;
    }
    .pin-name {
      background: rgba(0,0,0,0.85); color: #fff; font-size: 0.65rem; font-weight: bold;
      padding: 1px 6px; border-radius: 8px; border: 1px solid #06c755; white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- แถบด้านบน: โชว์โปรไฟล์ LINE ของเรา -->
  <div class="top-bar">
    <div class="user-profile-badge">
      <img id="myAvatarImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="user-avatar-mini">
      <span id="myNameText">กำลังเชื่อมต่อ LINE...</span>
    </div>
    <div style="font-size:0.75rem; color:#06c755; font-weight:bold;">
      <span id="gpsStatus">📡 รอพิกัด GPS...</span>
    </div>
  </div>

  <!-- ปุ่มลอย -->
  <div class="fab-group">
    <button class="btn-fab" id="btnMyLoc" title="พิกัดของฉัน">📍</button>
    <button class="btn-fab" id="btnSetTarget" title="ปักหมุดจุดนัดพบ">🚩</button>
    <button class="btn-fab" id="btnShareLine" title="แชร์เข้ากลุ่ม LINE">📤</button>
  </div>

  <!-- แผนที่ -->
  <div id="map"></div>

  <!-- แดชบอร์ดล่าง -->
  <div class="bottom-panel">
    <div class="target-box">
      <div><b>🚩 นัดพบ:</b> <span id="targetNameDisplay">ยังไม่ได้กำหนด</span></div>
      <span style="font-size:0.7rem; color:#cbd5e1;">(กด 🚩 เพื่อปักหมุด)</span>
    </div>
    <div class="member-scroll" id="memberList"></div>
  </div>

  <script>
    // ==========================================================================
    // 1. LIFF ID
    // ==========================================================================
    const MY_LIFF_ID = "2012010620-7LrsLOGx";
    
    // ตั้งค่าตัวแปรประจำตัว
    let myUserId = "U_" + Math.floor(1000 + Math.random() * 9000);
    let myName = ":PETE⚔️YURI:";
    let myAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    let myLat = 13.7563, myLng = 100.5018;
    let hasInitialGps = false;
    let currentTarget = null, isTargetMode = false;
    let markers = {}, targetMarker = null;

    // เริ่มต้นสร้างแผนที่
    const map = L.map('map', { zoomControl: false }).setView([myLat, myLng], 14);

    // 🗺️ เลเยอร์แผนที่ OpenStreetMap ตัวแท้ (ฟรีตลอดชีพ 100% ไม่ติด API Key)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ==========================================================================
    // 2. ดึงโปรไฟล์ LINE อัตโนมัติผ่าน LIFF SDK
    // ==========================================================================
    async function initLineLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          myUserId = profile.userId || myUserId;
          myName = profile.displayName || myName;
          myAvatar = profile.pictureUrl || myAvatar;

          document.getElementById("myNameText").textContent = myName;
          document.getElementById("myAvatarImg").src = myAvatar;

          // อัปเดตหมุดตัวเองทันทีที่ได้ชื่อ/รูป LINE
          if (hasInitialGps) {
            renderMyOwnMarker(myLat, myLng);
          }
        }
      } catch (err) {
        console.warn("LIFF info:", err);
        document.getElementById("myNameText").textContent = myName;
      }
    }
    initLineLiff();

    // ==========================================================================
    // 3. ฟังก์ชันปักหมุดตัวเองทันทีแบบ Local-First (เห็นตัวเองทันที ไม่ต้องรอหลังบ้าน)
    // ==========================================================================
    function renderMyOwnMarker(lat, lng) {
      if (!markers[myUserId]) {
        const pinHtml = `
          <div class="line-user-pin">
            <span class="pin-name">${myName} (ฉัน)</span><br>
            <img src="${myAvatar}" class="pin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
          </div>
        `;
        markers[myUserId] = L.marker([lat, lng], {
          icon: L.divIcon({ html: pinHtml, className: '', iconSize: [40, 50], iconAnchor: [20, 45] }),
          zIndexOffset: 1000 // ให้หมุดตัวเองอยู่บนสุดเสมอ
        }).addTo(map);
      } else {
        markers[myUserId].setLatLng([lat, lng]);
      }

      // แสดงการ์ดของตัวเองในแดชบอร์ดด้านล่างทันที
      updateMyCardInRoster(lat, lng);
    }

    function updateMyCardInRoster(lat, lng) {
      let myCard = document.getElementById("card_me");
      let distText = "-";
      if (currentTarget && currentTarget.lat) {
        const d = getDistance(lat, lng, currentTarget.lat, currentTarget.lng);
        distText = d < 1 ? (d * 1000).toFixed(0) + " ม." : d.toFixed(1) + " กม.";
      }

      if (!myCard) {
        const listEl = document.getElementById("memberList");
        myCard = document.createElement("div");
        myCard.id = "card_me";
        myCard.className = "member-card is-me";
        myCard.onclick = () => map.setView([myLat, myLng], 16);
        listEl.prepend(myCard);
      }
      myCard.innerHTML = `
        <img src="${myAvatar}" class="member-card-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        <div>
          <div><b>${myName}</b> (ฉัน)</div>
          <div style="color:#06c755; font-size:0.65rem;">🎯 ${distText}</div>
        </div>
      `;
    }

    // ==========================================================================
    // 4. ขอพิกัด GPS สดจากมือถือ (Watch Position)
    // ==========================================================================
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;
        document.getElementById("gpsStatus").textContent = "● GPS เชื่อมต่อแล้ว";
        document.getElementById("gpsStatus").style.color = "#06c755";

        // 1. ปักหมุดตัวเองทันทีบนจอ
        renderMyOwnMarker(myLat, myLng);

        // 2. ถ้าเป็นการจับพิกัดครั้งแรก ให้แพนกล้องซูมไปหาตำแหน่งตัวเองทันที
        if (!hasInitialGps) {
          hasInitialGps = true;
          map.setView([myLat, myLng], 16);
        }
      }, (err) => {
        console.warn("GPS Error:", err);
        document.getElementById("gpsStatus").textContent = "⚠️ ไม่ได้เปิด GPS";
        document.getElementById("gpsStatus").style.color = "#ef4444";
        alert("⚠️ กรุณากดอนุญาตให้เบราว์เซอร์เข้าถึงตำแหน่ง (GPS) เพื่อให้หมุดพิกัดของมึงโผล่ขึ้นบนแผนที่ครับ!");
      }, {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 10000
      });
    } else {
      alert("เบราว์เซอร์นี้ไม่รองรับ Geolocation GPS");
    }

    // ==========================================================================
    // 5. คำนวณระยะทาง (Haversine Formula)
    // ==========================================================================
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function renderTarget(t) {
      currentTarget = t;
      const label = document.getElementById("targetNameDisplay");
      if (!t || !t.lat) {
        label.textContent = "ยังไม่ได้กำหนด";
        if (targetMarker) map.removeLayer(targetMarker);
        return;
      }
      label.textContent = `${t.name} (โดย: ${t.by})`;
      if (!targetMarker) {
        targetMarker = L.marker([t.lat, t.lng], {
          icon: L.divIcon({ html: '🚩', className: '', iconSize: [32, 32] })
        }).addTo(map);
      } else {
        targetMarker.setLatLng([t.lat, t.lng]);
      }
      if (hasInitialGps) updateMyCardInRoster(myLat, myLng);
    }

    // ==========================================================================
    // 6. การกดปุ่มบนหน้าจอ
    // ==========================================================================
    // ปุ่มโฟกัสพิกัดตัวเอง (กดแล้ววิ่งกลับมาหาหมุดตัวเองทันที)
    document.getElementById("btnMyLoc").onclick = () => {
      if (hasInitialGps) {
        map.setView([myLat, myLng], 16);
      } else {
        alert("กำลังรอสัญญาณดาวเทียม GPS สักครู่...");
      }
    };

    // ปุ่มแตะแผนที่เพื่อตั้งเป้าหมาย
    document.getElementById("btnSetTarget").onclick = () => {
      isTargetMode = !isTargetMode;
      document.getElementById("btnSetTarget").classList.toggle("active", isTargetMode);
      if (isTargetMode) alert("📍 แตะบนแผนที่เพื่อตั้งจุดหมายนัดพบของกลุ่ม!");
    };

    map.on('click', (e) => {
      if (!isTargetMode) return;
      const name = prompt("🚩 ตั้งชื่อจุดนัดพบนี้:", "จุดนัดหมายกลุ่ม");
      if (!name) return;
      isTargetMode = false;
      document.getElementById("btnSetTarget").classList.remove("active");

      renderTarget({ name: name, lat: e.latlng.lat, lng: e.latlng.lng, by: myName });
      alert(`✅ ปักหมุดจุดนัดพบ [${name}] บนแผนที่เรียบร้อย!`);
    });

    // ปุ่มแชร์เข้าห้องแชท LINE กลุ่ม
    document.getElementById("btnShareLine").onclick = () => {
      if (typeof liff !== "undefined" && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([
          {
            type: "text",
            text: `🗺️ เปิดดูแผนที่พิกัดแก๊งสด & จุดนัดพบรวม:\nhttps://liff.line.me/${MY_LIFF_ID}`
          }
        ]);
      } else {
        alert("คัดลอกลิงก์ส่งเข้า LINE กลุ่มได้เลย:\nhttps://liff.line.me/" + MY_LIFF_ID);
      }
    };
  </script>
</body>
</html>
