<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📍 U-Nhai // แผนที่แก๊งสด</title>

  <!-- 1. LINE LIFF SDK 2.x -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 2. Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  
  <!-- 3. Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #fff; }
    #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #e5e3df; }

    /* ซ่อนลายน้ำ */
    .leaflet-control-attribution { display: none !important; }

    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(15, 23, 42, 0.94); border: 1px solid #334155;
      padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .user-profile-badge { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .btn-back-dash { text-decoration: none; color: #38bdf8; font-size: 1.1rem; padding: 2px 6px; display: flex; align-items: center; border-radius: 6px; }
    .btn-back-dash:hover { background: rgba(56,189,248,0.2); }
    
    /* โลโก้แอปหมุดนีออน */
    .app-logo-badge {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid #06c755;
      background: #0f172a; box-shadow: 0 0 10px rgba(6,199,85,0.7); flex-shrink: 0;
    }
    .user-avatar-mini {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid #38bdf8;
      object-fit: cover; background: #1e293b; flex-shrink: 0;
    }
    .room-badge-pill {
      background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8;
      font-size: 0.65rem; padding: 2px 6px; border-radius: 8px; font-weight: bold;
    }

    .fab-group { position: absolute; right: 12px; top: 65px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .btn-fab {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid #475569;
      background: #1e293b; color: #fff; font-size: 1.2rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      position: relative; transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-fab:active { transform: scale(0.92); }
    .btn-fab.active { background: #06c755; border-color: #fff; }

    .chat-badge {
      position: absolute; top: -2px; right: -2px; background: #ef4444; color: #fff;
      font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; font-weight: bold; display: none;
    }

    #searchTargetBox {
      position: absolute; top: 65px; left: 10px; right: 65px; z-index: 1000;
      background: rgba(15, 23, 42, 0.96); border: 1.5px solid #ef4444;
      border-radius: 14px; padding: 10px; display: none; flex-direction: column; gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    }
    .search-input-group { display: flex; gap: 6px; }
    .search-target-input {
      flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-search-go {
      background: #ef4444; color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }
    .btn-search-close {
      background: #334155; color: #cbd5e1; border: none; border-radius: 8px;
      padding: 8px 10px; cursor: pointer; font-size: 0.85rem;
    }
    .search-results-list {
      max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .search-result-item {
      background: #1e293b; padding: 8px 10px; border-radius: 6px; font-size: 0.75rem;
      cursor: pointer; display: flex; flex-direction: column; gap: 2px; border: 1px solid #334155;
    }
    .search-result-item:hover { background: #334155; border-color: #ef4444; }
    .item-title { font-weight: bold; color: #f8fafc; }
    .item-sub { font-size: 0.65rem; color: #94a3b8; }
    .search-manual-tip {
      font-size: 0.7rem; color: #38bdf8; text-align: center; cursor: pointer; padding: 4px;
      border-top: 1px dashed #334155; margin-top: 4px;
    }

    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
      padding: 10px 14px; border-radius: 16px 16px 0 0; max-height: 220px;
    }
    .target-box {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
      border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .member-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .member-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 6px 10px; min-width: 140px; font-size: 0.72rem; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .member-card.is-me { border-color: #06c755; background: rgba(6, 199, 85, 0.15); }
    .member-card.is-friend { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .member-card-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #0f172a; flex-shrink: 0; }

    .line-user-pin { text-align: center; position: relative; }
    .speech-bubble {
      position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #38bdf8; border: 1.5px solid #38bdf8;
      padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold;
      white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
    }
    .speech-bubble::after {
      content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: #38bdf8;
    }
    .pin-img {
      width: 44px; height: 44px; border-radius: 50%; border: 3px solid #06c755;
      box-shadow: 0 0 14px rgba(6,199,85,0.9); object-fit: cover; background: #000;
    }
    .pin-img.friend-pin { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56,189,248,0.9); }
    .pin-name {
      background: rgba(0,0,0,0.85); color: #fff; font-size: 0.68rem; font-weight: bold;
      padding: 2px 6px; border-radius: 8px; border: 1px solid #06c755; white-space: nowrap;
    }
    .pin-name.friend-name { border-color: #38bdf8; }

    .nav-popup { text-align: center; color: #1e293b; padding: 4px; }
    .nav-btn {
      display: inline-block; margin-top: 6px; background: #2563eb; color: #fff !important;
      padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold;
    }

    #chatDrawer {
      position: fixed; bottom: 0; left: 0; right: 0; height: 380px; z-index: 2000;
      background: #0f172a; border-top: 2px solid #38bdf8; border-radius: 20px 20px 0 0;
      display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
    }
    #chatDrawer.open { transform: translateY(0); }
    .chat-header {
      padding: 12px 16px; border-bottom: 1px solid #334155; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.9rem;
    }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-bubble {
      display: flex; gap: 8px; max-width: 85%; align-items: flex-start; font-size: 0.8rem;
    }
    .chat-bubble.mine { align-self: flex-end; flex-direction: row-reverse; }
    .chat-bubble-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
    .chat-bubble-text {
      background: #1e293b; border: 1px solid #334155; padding: 6px 10px; border-radius: 12px;
      color: #f1f5f9; word-break: break-word;
    }
    .chat-bubble.mine .chat-bubble-text { background: #06c755; color: #fff; border: none; }
    .chat-time { font-size: 0.6rem; color: #64748b; margin-top: 2px; }

    .chat-input-bar {
      padding: 10px 14px; border-top: 1px solid #334155; display: flex; gap: 8px; background: #0b0f19;
    }
    .chat-input {
      flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 20px;
      padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-send {
      background: #38bdf8; color: #0f172a; border: none; border-radius: 20px;
      padding: 8px 16px; font-weight: bold; cursor: pointer;
    }

    .profile-clickable { cursor: pointer; transition: opacity 0.15s ease; }
    .profile-clickable:hover { opacity: 0.85; }

    /* Modal บัญชีผู้ใช้ */
    #modalAccount {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000;
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(8px);
    }
    .account-card {
      background: #1e293b; border: 1px solid #475569; border-radius: 20px;
      width: 100%; max-width: 340px; padding: 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .acc-avatar {
      width: 72px; height: 72px; border-radius: 50%; border: 3px solid #06c755;
      margin: 0 auto 12px; object-fit: cover; box-shadow: 0 0 15px rgba(6,199,85,0.6);
      background: #0f172a;
    }
    .acc-name { font-size: 1.15rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .acc-id { font-size: 0.75rem; color: #94a3b8; margin-bottom: 20px; word-break: break-all; }
    .btn-acc {
      width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 0.9rem;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 10px; text-decoration: none;
    }
    .btn-acc-line { background: #06c755; color: #fff; }
    .btn-acc-google { background: #fff; color: #1f2937; }
    .btn-acc-logout { background: #ef4444; color: #fff; margin-top: 8px; }
    .btn-acc-close { background: #334155; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- แถบบน: โลโก้หมุดนีออนของแท้ + โปรไฟล์ -->
  <div class="top-bar">
    <div class="user-profile-badge profile-clickable" id="btnProfileHeader" title="แตะเพื่อจัดการบัญชี/เข้าสู่ระบบ/ออกจากระบบ">
      <a href="dashboard.html" class="btn-back-dash" title="กลับหน้า Dashboard">◀</a>
      
      <!-- โลโก้แอปนีออนแบบ SVG คมกริบ ไม่แตก ไม่พัง -->
      <div style="display:flex; align-items:center; gap:6px; background:#0f172a; padding:3px 8px 3px 4px; border-radius:10px; border:1px solid #06c755; box-shadow:0 0 8px rgba(6,199,85,0.4);">
        <div class="app-logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="#06c755" stroke="#ffffff" stroke-width="1.5"/>
            <circle cx="12" cy="9" r="3" fill="#ffffff"/>
          </svg>
        </div>
        <span style="font-size:0.75rem; font-weight:bold; color:#f8fafc; letter-spacing:0.5px;">U-Nhai</span>
      </div>

      <div style="display:flex; align-items:center; gap:6px;">
        <img id="myAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" referrerpolicy="no-referrer" class="user-avatar-mini">
        <span id="myNameText" style="max-width:85px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">สหาย</span>
        <span class="room-badge-pill" id="roomBadge">...</span>
      </div>
    </div>
    <div style="font-size:0.75rem; color:#06c755; font-weight:bold;">
      <span id="gpsStatus">📡 GPS สดพร้อม</span>
    </div>
  </div>

  <div id="searchTargetBox">
    <div class="search-input-group">
      <input type="text" class="search-target-input" id="searchTargetInput" placeholder="🔍 พิมพ์ชื่อสถานที่ (เช่น สยาม, เซ็นทรัล)...">
      <button class="btn-search-go" id="btnSearchTargetGo">ค้นหา</button>
      <button class="btn-search-close" id="btnSearchTargetClose">✕</button>
    </div>
    <div class="search-results-list" id="searchResultsList"></div>
    <div class="search-manual-tip" id="btnManualPickTip">👉 หรือ แตะบนแผนที่เพื่อปักหมุดเอง</div>
  </div>

  <div class="fab-group">
    <button class="btn-fab" id="btnToggleChat" title="เปิดห้องแชทสด">
      💬<span class="chat-badge" id="chatBadge">0</span>
    </button>
    <button class="btn-fab active" id="btnFollowMe" title="ล็อกมุมกล้องตามตัว">🎯</button>
    <button class="btn-fab" id="btnMyLoc" title="ดึงพิกัดปัจจุบัน">📍</button>
    <button class="btn-fab" id="btnSetTarget" title="ตั้งจุดนัดพบ (ค้นหาสถานที่)">🚩</button>
    <button class="btn-fab" id="btnShareLine" title="แชร์เข้ากลุ่ม LINE">📤</button>
    <button class="btn-fab" id="btnClearGhosts" title="ล้างหมุดผีทิ้ง" style="background:#7f1d1d; border-color:#ef4444;">🧹</button>
  </div>

  <div id="map"></div>

  <div id="chatDrawer">
    <div class="chat-header">
      <span>💬 แชทแก๊งสด (Live Chat)</span>
      <span style="cursor:pointer; font-size:1.2rem;" id="btnCloseChat">✕</span>
    </div>
    <div class="chat-messages" id="chatFeed"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="พิมพ์ข้อความในแก๊ง..." maxlength="150">
      <button class="btn-send" id="btnSendMsg">ส่ง</button>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="target-box" id="targetBox">
      <div><b>🚩 นัดพบ:</b> <span id="targetNameDisplay">ยังไม่ได้กำหนด</span></div>
      <div id="targetActionText" style="font-size:0.72rem; color:#38bdf8; font-weight:bold;">(แตะเพื่อปักหมุด)</div>
    </div>
    <div class="member-scroll" id="memberList"></div>
  </div>

  <!-- Modal บัญชีผู้ใช้: จัดการล็อกอิน LINE / Google / Logout -->
  <div id="modalAccount">
    <div class="account-card">
      <img id="accModalAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" class="acc-avatar" referrerpolicy="no-referrer">
      <div class="acc-name" id="accModalName">สหาย</div>
      <div class="acc-id" id="accModalId">สถานะ: บัญชีชั่วคราว</div>

      <div id="accLoginActions">
        <button class="btn-acc btn-acc-line" id="btnAccLoginLine">
          <span>💬</span> เข้าสู่ระบบด้วย LINE
        </button>
        <button class="btn-acc btn-acc-google" id="btnAccLoginGoogle">
          <span>🌐</span> เข้าสู่ระบบด้วย Google
        </button>
      </div>

      <button class="btn-acc btn-acc-logout" id="btnAccLogout">🚪 ออกจากระบบ (Log out)</button>
      <button class="btn-acc btn-acc-close" id="btnAccCloseModal">ปิดหน้าต่าง</button>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2012010620-7LrsLOGx";
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwKW0ynRLsyYCGvNs5i87kwRNJBSj79idNalA_r8Nbx8btdi8i_AliZdaAESM1tLS3W/exec";
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

    // ระบบตรวจจับภาษาเริ่มต้นของเครื่อง
    const deviceLang = (navigator.language || navigator.userLanguage || "th").toLowerCase();
    const isThai = deviceLang.startsWith("th");

    const i18n = {
      title: isThai ? "📍 U-Nhai // แผนที่แก๊งสด" : "📍 U-Nhai // Squad Live Map",
      connecting: isThai ? "กำลังเชื่อมต่อ..." : "Connecting...",
      gpsReady: isThai ? "📡 GPS สดพร้อม" : "📡 Live GPS Ready",
      gpsOff: isThai ? "⚠️ ไม่เปิด GPS" : "⚠️ GPS Disabled",
      searchPlaceholder: isThai ? "🔍 พิมพ์ชื่อสถานที่ (เช่น สยาม, เซ็นทรัล)..." : "🔍 Search places (e.g. Central, Mall, Airport)...",
      searchBtn: isThai ? "ค้นหา" : "Search",
      manualPickTip: isThai ? "👉 หรือ แตะบนแผนที่เพื่อปักหมุดเอง" : "👉 Or tap anywhere on map to pin",
      searching: isThai ? "🔍 กำลังค้นหา" : "🔍 Searching",
      notFound: isThai ? "❌ ไม่พบสถานที่ ลองใช้คำค้นหาอื่น" : "❌ Place not found, try another keyword",
      searchError: isThai ? "เกิดข้อผิดพลาดในการค้นหา ลองอีกครั้ง" : "Search error, please try again",
      chatTitle: isThai ? "💬 แชทแก๊งสด (Live Chat)" : "💬 Squad Live Chat",
      chatPlaceholder: isThai ? "พิมพ์ข้อความในแก๊ง..." : "Type message to squad...",
      sendBtn: isThai ? "ส่ง" : "Send",
      targetLabel: isThai ? "🚩 นัดพบ:" : "🚩 Rendezvous:",
      targetNone: isThai ? "ยังไม่ได้กำหนด" : "Not set yet",
      targetTapPin: isThai ? "(แตะเพื่อปักหมุด)" : "(Tap to set pin)",
      targetNavMaps: isThai ? "🚗 นำทางด้วย Google Maps" : "🚗 Navigate with Google Maps",
      navGoogle: isThai ? "🚗 นำทางด้วย Google Maps" : "🚗 Navigate with Google Maps",
      navTarget: isThai ? "🚗 นำทางไปยังจุดนัดพบ" : "🚗 Navigate to Rendezvous",
      meLabel: isThai ? "(ฉัน)" : "(Me)",
      awayLabel: isThai ? "ห่าง" : "Away",
      mUnit: isThai ? "ม." : "m",
      kmUnit: isThai ? "กม." : "km",
      clearGhostsConfirm: isThai ? "ต้องการล้างหมุดผีและแชทของห้อง [ROOM] ใช่หรือไม่?" : "Do you want to clear ghost pins and chat for room [ROOM]?",
      clearGhostsDone: isThai ? "✅ ล้างห้องนี้เกลี้ยงแล้ว!" : "✅ Cleared room completely!",
      accTemp: isThai ? "⚠️ บัญชีชั่วคราว (กดล็อกอินด้านล่าง)" : "⚠️ Temporary Account (Log in below)",
      accLogged: isThai ? "● บัญชี:" : "● Account:",

    // ฟังก์ชันเชื่อมต่อ LIFF
    async function initFastLiff() {
      try {
        if (typeof liff === "undefined") {
          console.warn("LIFF SDK not found");
          updateUserUI();
          return;
        }

        await liff.init({ liffId: MY_LIFF_ID });

        if (liff.isLoggedIn()) {
          try {
            const profile = await liff.getProfile();
            myUserId = profile.userId;
            myName = profile.displayName || myName;
            myAvatar = profile.pictureUrl || myAvatar;
            authProvider = "line";
            isLoggedIn = true;
          } catch (pe) {
            const idToken = liff.getDecodedIDToken();
            if (idToken) {
              myUserId = idToken.sub || myUserId;
              myName = idToken.name || myName;
              myAvatar = idToken.picture || myAvatar;
              authProvider = "line";
              isLoggedIn = true;
            }
          }

          localStorage.setItem("SQUAD_UID", myUserId);
          localStorage.setItem("SQUAD_UNAME", myName);
          localStorage.setItem("SQUAD_UAVATAR", myAvatar);
          localStorage.setItem("SQUAD_AUTH_PROVIDER", "line");
        } else {
          // ถ้าเปิดในแอป LINE ให้ล็อกอินอัตโนมัติ
          if (liff.isInClient()) {
            liff.login();
            return;
          }
          if (authProvider === "google" && localStorage.getItem("SQUAD_UID")) {
            isLoggedIn = true;
          }
        }
      } catch (err) {
        console.warn("LIFF init bypass:", err);
        if (authProvider) isLoggedIn = true;
      }

      updateUserUI();

      if (hasGps) {
        renderMyMarker(myLat, myLng, true);
        syncSquadLocation();
      }
    }
    initFastLiff();

    function renderMyMarker(lat, lng, forceUpdate = false, bubbleText = "") {
      const bubbleHtml = bubbleText ? `<div class="speech-bubble">💬 ${bubbleText}</div>` : "";
      const pinHtml = `
        <div class="line-user-pin">
          ${bubbleHtml}
          <span class="pin-name">${myName} ${i18n.meLabel}</span><br>
          <img src="${myAvatar}" referrerpolicy="no-referrer" class="pin-img" onerror="this.src='${DEFAULT_AVATAR}'">
        </div>`;

      if (!markers[myUserId]) {
        markers[myUserId] = L.marker([lat, lng], {
          icon: L.divIcon({ html: pinHtml, className: "", iconSize: [44, 55], iconAnchor: [22, 50] }),
          zIndexOffset: 1000
        }).addTo(map);
      } else {
        markers[myUserId].setLatLng([lat, lng]);
        if (forceUpdate || bubbleText) {
          markers[myUserId].setIcon(L.divIcon({ html: pinHtml, className: "", iconSize: [44, 55], iconAnchor: [22, 50] }));
        }
      }

      if (!accuracyCircle) {
        accuracyCircle = L.circle([lat, lng], { radius: 15, color: "#06c755", fillOpacity: 0.15 }).addTo(map);
      } else {
        accuracyCircle.setLatLng([lat, lng]);
      }
    }

    function renderFriendMarker(member) {
      const uid = member.userId;
      const hasRecentMsg = member.lastMsg && (Date.now() - member.lastMsgTime < 15000);
      const bubbleHtml = hasRecentMsg ? `<div class="speech-bubble">💬 ${member.lastMsg}</div>` : "";
      const avatarSrc = member.avatar || DEFAULT_AVATAR;

      const pinHtml = `
        <div class="line-user-pin">
          ${bubbleHtml}
          <span class="pin-name friend-name">${member.name}</span><br>
          <img src="${avatarSrc}" referrerpolicy="no-referrer" class="pin-img friend-pin" onerror="this.src='${DEFAULT_AVATAR}'">
        </div>`;

      const popupContent = `
        <div class="nav-popup">
          <b>${member.name}</b><br>
          <span style="font-size:0.75rem; color:#64748b;">${i18n.awayLabel}: ${getDistanceText(myLat, myLng, member.lat, member.lng)}</span><br>
          <a href="javascript:void(0)" onclick="openGoogleMapsNav(${member.lat}, ${member.lng})" class="nav-btn">
            ${i18n.navGoogle}
          </a>
        </div>`;

      if (!markers[uid]) {
        markers[uid] = L.marker([member.lat, member.lng], {
          icon: L.divIcon({ html: pinHtml, className: "", iconSize: [44, 55], iconAnchor: [22, 50] })
        }).addTo(map).bindPopup(popupContent);
      } else {
        markers[uid].setLatLng([member.lat, member.lng]);
        markers[uid].setIcon(L.divIcon({ html: pinHtml, className: "", iconSize: [44, 55], iconAnchor: [22, 50] }));
        markers[uid].setPopupContent(popupContent);
      }
    }

    async function syncSquadLocation(pendingTarget, chatMessage) {
      if (!hasGps || !BACKEND_URL) return;
      try {
        const payload = {
          roomId: currentRoomId,
          userId: myUserId,
          name: myName,
          avatar: myAvatar,
          lat: myLat,
          lng: myLng
        };
        if (pendingTarget) payload.setTarget = pendingTarget;
        if (chatMessage) payload.chatMsg = chatMessage;

        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data && data.members) updateRosterAndMap(data.members);
        if (data && data.target) renderTarget(data.target);
        if (data && data.chat) updateChatFeed(data.chat);
      } catch (e) {
        console.warn("Sync error:", e);
      }
    }

    function updateChatFeed(messages) {
      const feed = document.getElementById("chatFeed");
      if (!feed) return;
      feed.innerHTML = "";
      messages.forEach(m => {
        const isMine = m.userId === myUserId;
        const row = document.createElement("div");
        row.className = `chat-bubble ${isMine ? "mine" : ""}`;
        row.innerHTML = `
          <img src="${m.avatar || DEFAULT_AVATAR}" class="chat-bubble-avatar" referrerpolicy="no-referrer" onerror="this.src='${DEFAULT_AVATAR}'">
          <div>
            <div style="font-size:0.68rem; color:#94a3b8;">${m.name}</div>
            <div class="chat-bubble-text">${m.text}</div>
            <div class="chat-time">${m.time}</div>
          </div>`;
        feed.appendChild(row);
      });
      feed.scrollTop = feed.scrollHeight;

      if (!isChatOpen && messages.length > lastChatCount) {
        const badge = document.getElementById("chatBadge");
        if (badge) {
          badge.style.display = "block";
          badge.textContent = (messages.length - lastChatCount);
        }
      }
      lastChatCount = messages.length;
    }

    function getDistanceText(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lat2) return "-";
      const d = getDistance(lat1, lon1, lat2, lon2);
      return d < 1 ? (d * 1000).toFixed(0) + ` ${i18n.mUnit}` : d.toFixed(1) + ` ${i18n.kmUnit}`;
    }

    function updateRosterAndMap(membersList) {
      const listEl = document.getElementById("memberList");
      if (!listEl) return;
      listEl.innerHTML = "";

      renderMyMarker(myLat, myLng);
      let myDistText = currentTarget ? getDistanceText(myLat, myLng, currentTarget.lat, currentTarget.lng) : "-";

      const myCard = document.createElement("div");
      myCard.className = "member-card is-me";
      myCard.onclick = () => { autoFollow = true; map.setView([myLat, myLng], 17); };
      myCard.innerHTML = `
        <img src="${myAvatar}" referrerpolicy="no-referrer" class="member-card-img" onerror="this.src='${DEFAULT_AVATAR}'">
        <div>
          <div><b>${myName}</b> ${i18n.meLabel}</div>
          <div style="color:#06c755; font-size:0.65rem;">🎯 ${i18n.targetLabel} ${myDistText}</div>
        </div>`;
      listEl.appendChild(myCard);

      membersList.forEach(m => {
        if (m.userId === myUserId) return;
        renderFriendMarker(m);

        let distToMe = getDistanceText(myLat, myLng, m.lat, m.lng);

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;
        const gpsEl = document.getElementById("gpsStatus");
        if (gpsEl) {
          gpsEl.textContent = i18n.gpsReady;
          gpsEl.style.color = "#06c755";
        }

        if (!hasGps) {
          hasGps = true;
          map.setView([myLat, myLng], 17);
          map.invalidateSize();
        }
        renderMyMarker(myLat, myLng);

        if (autoFollow) {
          map.panTo([myLat, myLng], { animate: true, duration: 0.5 });

        syncSquadLocation();
      }, (err) => {
        const gpsEl = document.getElementById("gpsStatus");
        if (gpsEl) {
          gpsEl.textContent = i18n.gpsOff;

      }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 8000
      });
    }

    setInterval(() => {
      syncSquadLocation();
    }, 3000);

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function renderTarget(t) {
      currentTarget = t;
      const label = document.getElementById("targetNameDisplay");
      const actionText = document.getElementById("targetActionText");

      if (!t || !t.lat) {
        if (label) label.textContent = i18n.targetNone;
        if (actionText) {
          actionText.textContent = i18n.targetTapPin;
          actionText.style.color = "#cbd5e1";
        }
        if (targetMarker) map.removeLayer(targetMarker);
        return;
      }

      let distText = getDistanceText(myLat, myLng, t.lat, t.lng);
      if (label) label.textContent = `${t.name} (${distText})`;
      if (actionText) {
        actionText.textContent = i18n.targetNavMaps;
        actionText.style.color = "#22c55e";
      }

      const popupTarget = `
        <div class="nav-popup">
          <b>🚩 ${i18n.targetLabel} ${t.name}</b><br>
          <span style="font-size:0.75rem; color:#64748b;">${i18n.meLabel}: ${t.by} (${i18n.awayLabel} ${distText})</span><br>
          <a href="javascript:void(0)" onclick="openGoogleMapsNav(${t.lat}, ${t.lng})" class="nav-btn" style="background:#ef4444;">
            ${i18n.navTarget}
          </a>
        </div>`;

      if (!targetMarker) {
        targetMarker = L.marker([t.lat, t.lng], {
          icon: L.divIcon({ html: '<span style="font-size:2rem;">🚩</span>', className: "", iconSize: [36, 36], iconAnchor: [18, 30] })
        }).addTo(map).bindPopup(popupTarget);
      } else {
        targetMarker.setLatLng([t.lat, t.lng]);
        targetMarker.setPopupContent(popupTarget);
      }
    }

    async function executePlaceSearch() {
      const q = searchTargetInput.value.trim();
      if (!q) return;

      searchResultsList.innerHTML = `<div style="text-align:center; padding:8px; font-size:0.75rem; color:#94a3b8;">${i18n.searching} "${q}"...</div>`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=th&limit=5&addressdetails=1`;
        const res = await fetch(url, { headers: { "Accept-Language": isThai ? "th,en" : "en,th" } });
        const data = await res.json();

        if (!data || !data.length) {
          searchResultsList.innerHTML = `<div style="text-align:center; padding:8px; font-size:0.75rem; color:#ef4444;">${i18n.notFound}</div>`;
          return;
        }

        searchResultsList.innerHTML = "";
        data.forEach(item => {
          const lat = parseFloat(item.lat);
          const lon = parseFloat(item.lon);
          const shortName = item.name || item.display_name.split(",")[0];
          const fullDesc = item.display_name;

          const div = document.createElement("div");
          div.className = "search-result-item";
          div.innerHTML = `
            <div class="item-title">📍 ${shortName}</div>
            <div class="item-sub">${fullDesc.substring(0, 75)}...</div>
          `;
          div.onclick = () => {
            selectAndPinTarget(shortName, lat, lon);
          };
          searchResultsList.appendChild(div);
        });
      } catch (err) {
        searchResultsList.innerHTML = `<div style="text-align:center; padding:8px; font-size:0.75rem; color:#ef4444;">${i18n.searchError}</div>`;
      }
    }

    document.getElementById("btnSearchTargetGo").onclick = executePlaceSearch;
    searchTargetInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executePlaceSearch();
    });

    function selectAndPinTarget(placeName, lat, lng) {
      searchTargetBox.style.display = "none";
      autoFollow = false;
      document.getElementById("btnFollowMe").classList.remove("active");

      map.flyTo([lat, lng], 17, { duration: 1.5 });

      const newTarget = { name: placeName, lat: lat, lng: lng, by: myName };
      renderTarget(newTarget);
      syncSquadLocation(newTarget);
      alert(`✅ ${i18n.pinnedAt} [${placeName}]`);
    }

            altText: `📍 แผนที่แก๊งสด: [${currentRoomId}]`,
            contents: {
              type: "bubble",
              size: "kilo",
              header: {
                type: "box",
                layout: "horizontal",
                backgroundColor: "#0f172a",
                contents: [
                  { type: "text", text: "📍 U-Nhai", weight: "bold", color: "#06c755", size: "sm" },
                  { type: "text", text: currentRoomId, weight: "bold", color: "#38bdf8", size: "xxs", align: "end" }
                ]
              },
              body: {
                type: "box",
                layout: "vertical",
                backgroundColor: "#1e293b",
                spacing: "sm",
                contents: [
                  { type: "text", text: "🗺️ แผนที่พิกัดแก๊งสด", weight: "bold", size: "md", color: "#ffffff" },
                  { type: "text", text: "แตะปุ่มด้านล่างเพื่อเปิดแผนที่และดูตำแหน่งเพื่อนทันที", size: "xs", color: "#94a3b8" }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                backgroundColor: "#0f172a",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#06c755",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "🚗 เข้าดูแผนที่สด",
                      uri: shareUrl
                    }
                  }
                ]
              }
            }
          }
        ]);
      } else {
        alert(i18n.copied + shareUrl);
      }
    };

    // ล้างหมุดผี
    document.getElementById("btnClearGhosts").onclick = async () => {
      if (confirm(i18n.clearGhostsConfirm.replace("[ROOM]", currentRoomId))) {
        await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "clear", roomId: currentRoomId })
        });
        alert(i18n.clearGhostsDone);
        location.reload();
      }
    };

    // แชทสด
    const chatDrawer = document.getElementById("chatDrawer");
    document.getElementById("btnToggleChat").onclick = () => {
      isChatOpen = !isChatOpen;
      chatDrawer.classList.toggle("open", isChatOpen);
      if (isChatOpen) {
        document.getElementById("chatBadge").style.display = "none";
        document.getElementById("chatInput").focus();
      }
    };
    document.getElementById("btnCloseChat").onclick = () => {
      isChatOpen = false;
      chatDrawer.classList.remove("open");
    };

    async function sendChatMessage() {
      const input = document.getElementById("chatInput");
      const msg = input.value.trim();
      if (!msg) return;

      input.value = "";
      renderMyMarker(myLat, myLng, true, msg);
      await syncSquadLocation(null, msg);
    }

    document.getElementById("btnSendMsg").onclick = sendChatMessage;
    document.getElementById("chatInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    // จัดการระบบ Modal บัญชีผู้ใช้ & ล็อกอิน / ออกจากระบบ
    const modalAcc = document.getElementById("modalAccount");
    const btnProfileHeader = document.getElementById("btnProfileHeader");
    if (btnProfileHeader) {
      btnProfileHeader.onclick = (e) => {
        if (e.target.closest(".btn-back-dash")) return;
        updateUserUI();
        if (modalAcc) modalAcc.style.display = "flex";
      };
    }
    const btnAccClose = document.getElementById("btnAccCloseModal");
    if (btnAccClose) {
      btnAccClose.onclick = () => {
        if (modalAcc) modalAcc.style.display = "none";
      };
    }
    if (modalAcc) {
      modalAcc.onclick = (e) => {
        if (e.target === modalAcc) modalAcc.style.display = "none";
      };
    }

    // ล็อกอิน LINE
    document.getElementById("btnAccLoginLine").onclick = () => {
      if (typeof liff !== "undefined") {
        liff.login({ redirectUri: window.location.href });
      } else {
        alert("กำลังเชื่อมต่อระบบ LINE LIFF กรุณาลองใหม่อีกครั้ง");
      }
    };

    // ล็อกอิน Google
    document.getElementById("btnAccLoginGoogle").onclick = () => {
      const gEmail = prompt(i18n.googlePrompt, "");
      if (gEmail && gEmail.trim()) {
        const cleanG = gEmail.trim();
        myUserId = "G_" + btoa(unescape(encodeURIComponent(cleanG))).replace(/=/g, "").slice(0, 10);
        myName = cleanG.split("@")[0];
        myAvatar = "https://cdn-icons-png.flaticon.com/512/300/300221.png";
        authProvider = "google";
        isLoggedIn = true;

        localStorage.setItem("SQUAD_UID", myUserId);
        localStorage.setItem("SQUAD_UNAME", myName);
        localStorage.setItem("SQUAD_UAVATAR", myAvatar);
        localStorage.setItem("SQUAD_AUTH_PROVIDER", "google");

        updateUserUI();
        if (modalAcc) modalAcc.style.display = "none";
        renderMyMarker(myLat, myLng, true);
        syncSquadLocation();
        alert(`✅ ${i18n.loggedAs} [${myName}]`);
      }
    };

    // ออกจากระบบ (Logout)
    document.getElementById("btnAccLogout").onclick = async () => {
      if (confirm(i18n.logoutConfirm)) {
        try {
          await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "logout", roomId: currentRoomId, userId: myUserId })
          });
        } catch (e) {}

        localStorage.removeItem("SQUAD_UID");
        localStorage.removeItem("SQUAD_UNAME");
        localStorage.removeItem("SQUAD_UAVATAR");
        localStorage.removeItem("SQUAD_AUTH_PROVIDER");

        if (typeof liff !== "undefined" && liff.isLoggedIn()) {
          liff.logout();
        }

        alert(i18n.logoutDone);
        location.reload();
      }
    };
  </script>
</body>
</html>
