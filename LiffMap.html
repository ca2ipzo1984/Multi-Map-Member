<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U-Nhai - LiffMap.html</title>

  <!-- 1. LINE LIFF SDK 2.x -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 2. Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  
  <!-- 3. Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; color: #fff; }
    #map { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; background: #0b0f19; }

    .leaflet-control-attribution { display: none !important; }

    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(15, 23, 42, 0.94); border: 1px solid #334155;
      padding: 6px 10px; border-radius: 12px; backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .top-bar-left {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .top-bar-right {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .btn-exit-door {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: #1e293b; border: 1px solid #475569;
      color: #38bdf8; text-decoration: none; font-size: 1.1rem;
      transition: all 0.15s ease; flex-shrink: 0;
    }
    .btn-exit-door:active {
      transform: scale(0.92); background: rgba(56, 189, 248, 0.2); border-color: #38bdf8;
    }
    .user-profile-badge {
      display: flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0;
    }
    .avatar-wrapper {
      position: relative; width: 30px; height: 30px; flex-shrink: 0;
    }
    .user-avatar-mini {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid #38bdf8;
      object-fit: cover; background: #1e293b; display: block;
    }
    .gps-led-dot {
      position: absolute; bottom: -1px; right: -1px; width: 8px; height: 8px;
      border-radius: 50%; border: 1.5px solid #0f172a; background: #ef4444;
      box-shadow: 0 0 6px #ef4444; transition: all 0.3s ease;
    }
    .gps-led-dot.green {
      background: #22c55e; box-shadow: 0 0 7px #22c55e;
    }
    .gps-led-dot.red {
      background: #ef4444; box-shadow: 0 0 7px #ef4444;
    }
    .user-name-text {
      font-size: 0.82rem; font-weight: 700; color: #f8fafc;
      max-width: 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .room-led-pill {
      font-family: 'Courier New', Courier, monospace;
      background: #020617; border: 1.2px solid #38bdf8; color: #38bdf8;
      font-size: 0.72rem; font-weight: 800; padding: 4px 8px; border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.35), 0 0 8px rgba(56, 189, 248, 0.25);
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
      cursor: pointer; user-select: none; -webkit-user-select: none;
    }
    .room-led-pill:active { transform: scale(0.95); }
    .btn-top-search {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1.5px solid #ef4444; background: rgba(239, 68, 68, 0.15);
      color: #ef4444; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); transition: all 0.15s ease; flex-shrink: 0;
    }
    .btn-top-search:active, .btn-top-search.active {
      background: #ef4444; color: #fff; transform: scale(0.92);
    }
    .btn-top-menu {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1.5px solid #38bdf8; background: rgba(56, 189, 248, 0.15);
      color: #38bdf8; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); transition: all 0.15s ease; flex-shrink: 0;
    }
    .btn-top-menu:active, .btn-top-menu.active {
      background: #38bdf8; color: #0b0f19; transform: scale(0.92);
    }
    .btn-top-menu.active svg { stroke: #0b0f19; }

    /* Dropdown Menu ด้านบนขวา */
    .top-dropdown-menu {
      position: absolute; top: 54px; right: 10px; z-index: 10005;
      background: rgba(15, 23, 42, 0.98); border: 1.5px solid #334155;
      border-radius: 14px; padding: 10px; min-width: 240px;
      display: none; flex-direction: column; gap: 3px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.85); backdrop-filter: blur(14px);
    }
    .dropdown-header-room {
      display: flex; align-items: center; justify-content: space-between;
      background: #020617; border: 1px solid #38bdf8; border-radius: 8px;
      padding: 6px 10px; margin-bottom: 6px;
    }
    .dropdown-room-tag {
      font-family: 'Courier New', monospace; font-size: 0.78rem;
      font-weight: 800; color: #38bdf8; text-shadow: 0 0 6px rgba(56,189,248,0.5);
    }
    .btn-dropdown-copy {
      background: rgba(56,189,248,0.2); border: 1px solid #38bdf8; color: #38bdf8;
      border-radius: 6px; padding: 3px 8px; font-size: 0.68rem; font-weight: bold; cursor: pointer;
    }
    .dropdown-divider { height: 1px; background: #334155; margin: 4px 0; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px; font-size: 0.8rem;
      color: #f1f5f9; cursor: pointer; transition: background 0.12s ease;
      user-select: none; -webkit-user-select: none;
    }
    .dropdown-item:hover, .dropdown-item:active { background: #1e293b; }
    .dropdown-item-icon { font-size: 1rem; width: 22px; text-align: center; flex-shrink: 0; }

    /* หน้าจอโหลดข้อมูล (Loading Overlay) */
    .loading-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: #0b0f19;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .loading-overlay.fade-out {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .loading-card {
      background: rgba(15, 23, 42, 0.96);
      border: 1.5px solid #334155;
      border-radius: 20px;
      padding: 30px 22px;
      width: 100%; max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.85);
      backdrop-filter: blur(14px);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .loading-logo-box {
      position: relative; width: 84px; height: 84px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .loading-logo-img {
      width: 68px; height: 68px; border-radius: 16px;
      object-fit: cover; box-shadow: 0 0 20px rgba(6,199,85,0.6);
      background: #0f172a;
    }
    .loading-spinner-ring {
      position: absolute; inset: 0;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spinRing 1s linear infinite;
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }
    .loading-title {
      font-size: 0.95rem; font-weight: 700; color: #f8fafc; line-height: 1.45;
    }
    .loading-sub { font-size: 0.72rem; color: #94a3b8; }
    .loading-bar-track {
      width: 100%; height: 6px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-top: 4px;
    }
    .loading-bar-fill {
      height: 100%; background: linear-gradient(90deg, #38bdf8, #06c755); border-radius: 6px;
      animation: loadBarAnim 1.6s ease-in-out infinite;
    }
    @keyframes loadBarAnim {
      0% { width: 15%; transform: translateX(-20%); }
      50% { width: 75%; transform: translateX(10%); }
      100% { width: 100%; transform: translateX(0); }
    }

    /* Modal แจ้งบั๊ก/เสนอแนะ */
    .feedback-card {
      background: #1e293b; border: 1px solid #475569; border-radius: 18px;
      width: 100%; max-width: 360px; padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.85); display: flex; flex-direction: column;
    }
    .feedback-header { display: flex; justify-content: space-between; align-items: center; }
    .btn-close-feedback {
      background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 4px;
    }
    .btn-fb-type {
      flex: 1; padding: 7px; border-radius: 6px; font-size: 0.72rem; font-weight: bold;
      border: 1px solid #334155; background: #0f172a; color: #94a3b8; cursor: pointer;
    }
    .btn-fb-type.active {
      border-color: #f59e0b; background: rgba(245, 158, 11, 0.15); color: #f59e0b;
    }
    .feedback-textarea {
      width: 100%; background: #0f172a; border: 1.5px solid #334155; border-radius: 10px;
      padding: 10px 12px; color: #fff; font-size: 0.82rem; outline: none; resize: none;
      font-family: inherit; margin-top: 6px;
    }
    .feedback-textarea:focus { border-color: #f59e0b; }
    .feedback-meta { font-size: 0.68rem; color: #64748b; margin-top: 6px; }
    .btn-fb-cancel {
      flex: 1; background: #334155; color: #cbd5e1; border: none; border-radius: 8px;
      padding: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
    .btn-fb-submit {
      flex: 2; background: #f59e0b; color: #0f172a; border: none; border-radius: 8px;
      padding: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }

    /* ควบคุม Responsive Layout สำหรับ iPad, Tablet และ PC */
    @media (min-width: 640px) {
      .top-bar {
        max-width: 720px; margin: 0 auto;
        left: 20px; right: 20px; top: 16px; padding: 8px 16px;
      }
      .top-dropdown-menu {
        right: max(20px, calc((100vw - 720px) / 2 + 10px));
        top: 66px; min-width: 260px;
      }
      #searchTargetBox {
        max-width: 500px; left: auto;
        right: max(20px, calc((100vw - 720px) / 2 + 10px));
        top: 66px;
      }
      .fab-group {
        top: 78px; right: max(20px, calc((100vw - 720px) / 2 + 10px));
      }
      .bottom-panel {
        max-width: 680px; left: 50%; transform: translateX(-50%);
        border-radius: 18px 18px 0 0; border: 1px solid #334155; border-bottom: none;
        padding: 12px 18px;
      }
      #chatDrawer {
        max-width: 460px; left: auto; right: 24px;
        border-radius: 20px 20px 0 0; border-left: 1px solid #334155; border-right: 1px solid #334155;
      }
    }

    @media (min-width: 1024px) {
      .top-bar { max-width: 860px; }
      .top-dropdown-menu { right: max(24px, calc((100vw - 860px) / 2 + 10px)); }
      #searchTargetBox { right: max(24px, calc((100vw - 860px) / 2 + 10px)); }
      .fab-group { right: max(24px, calc((100vw - 860px) / 2 + 10px)); }
      .bottom-panel { max-width: 800px; }
    }


    .fab-group { position: absolute; right: 12px; top: 65px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .btn-fab {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid #475569;
      background: #1e293b; color: #fff; font-size: 1.2rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      position: relative; transition: transform 0.15s ease, background 0.15s ease;
      user-select: none; -webkit-user-select: none;
    }
    .btn-fab:active { transform: scale(0.92); }
    .btn-fab.active { background: #06c755; border-color: #fff; }

    .chat-badge {
      position: absolute; top: -2px; right: -2px; background: #ef4444; color: #fff;
      font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; font-weight: bold; display: none;
    }

    #searchTargetBox {
      position: absolute; top: 62px; left: 10px; right: 10px; z-index: 10002;
      background: rgba(15, 23, 42, 0.98); border: 1.5px solid #ef4444;
      border-radius: 14px; padding: 12px; display: none; flex-direction: column; gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      pointer-events: auto;
    }
    .search-input-group { display: flex; gap: 6px; }
    .search-target-input {
      flex: 1; background: #0f172a; border: 1.5px solid #334155; border-radius: 8px;
      padding: 10px 12px; color: #fff; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text;
    }
    .search-target-input:focus { border-color: #ef4444; }
    .btn-search-go {
      background: #ef4444; color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }
    .btn-search-close {
      background: #334155; color: #cbd5e1; border: none; border-radius: 8px;
      padding: 8px 10px; cursor: pointer; font-size: 0.85rem;
    }
    .search-results-list {
      max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .search-result-item {
      background: #1e293b; padding: 8px 10px; border-radius: 6px; font-size: 0.75rem;
      cursor: pointer; display: flex; flex-direction: column; gap: 2px; border: 1px solid #334155;
    }
    .search-result-item:hover { background: #334155; border-color: #ef4444; }
    .item-title { font-weight: bold; color: #f8fafc; }
    .item-sub { font-size: 0.65rem; color: #94a3b8; }
    .search-manual-tip {
      font-size: 0.7rem; color: #38bdf8; text-align: center; cursor: pointer; padding: 4px;
      border-top: 1px dashed #334155; margin-top: 4px;
    }

    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
      padding: 10px 14px; border-radius: 16px 16px 0 0; max-height: 220px;
    }
    .target-box {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
      border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    .member-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .member-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 6px 10px; min-width: 140px; font-size: 0.72rem; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .member-card.is-me { border-color: #06c755; background: rgba(6, 199, 85, 0.15); }
    .member-card.is-friend { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .member-card-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #0f172a; flex-shrink: 0; }

    .line-user-pin { text-align: center; position: relative; }
    .speech-bubble {
      position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #38bdf8; border: 1.5px solid #38bdf8;
      padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold;
      white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
    }
    .speech-bubble::after {
      content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: #38bdf8;
    }
    .pin-img {
      width: 44px; height: 44px; border-radius: 50%; border: 3px solid #06c755;
      box-shadow: 0 0 14px rgba(6,199,85,0.9); object-fit: cover; background: #000;
    }
    .pin-img.friend-pin { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56,189,248,0.9); }
    .pin-name {
      background: rgba(0,0,0,0.85); color: #fff; font-size: 0.68rem; font-weight: bold;
      padding: 2px 6px; border-radius: 8px; border: 1px solid #06c755; white-space: nowrap;
    }
    .pin-name.friend-name { border-color: #38bdf8; }

    .nav-popup { text-align: center; color: #1e293b; padding: 4px; }
    .nav-btn {
      display: inline-block; margin-top: 6px; background: #2563eb; color: #fff !important;
      padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold;
    }

    #chatDrawer {
      position: fixed; bottom: 0; left: 0; right: 0; height: 380px; z-index: 2000;
      background: #0f172a; border-top: 2px solid #38bdf8; border-radius: 20px 20px 0 0;
      display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
    }
    #chatDrawer.open { transform: translateY(0); }
    .chat-header {
      padding: 12px 16px; border-bottom: 1px solid #334155; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.9rem;
    }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-bubble {
      display: flex; gap: 8px; max-width: 85%; align-items: flex-start; font-size: 0.8rem;
    }
    .chat-bubble.mine { align-self: flex-end; flex-direction: row-reverse; }
    .chat-bubble-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
    .chat-bubble-text {
      background: #1e293b; border: 1px solid #334155; padding: 6px 10px; border-radius: 12px;
      color: #f1f5f9; word-break: break-word;
    }
    .chat-bubble.mine .chat-bubble-text { background: #06c755; color: #fff; border: none; }
    .chat-time { font-size: 0.6rem; color: #64748b; margin-top: 2px; }

    .chat-input-bar {
      padding: 10px 14px; border-top: 1px solid #334155; display: flex; gap: 8px; background: #0b0f19;
    }
    .chat-input {
      flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 20px;
      padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-send {
      background: #38bdf8; color: #0f172a; border: none; border-radius: 20px;
      padding: 8px 16px; font-weight: bold; cursor: pointer;
    }

    #modalAccount {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000;
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(8px);
    }
    .account-card {
      background: #1e293b; border: 1px solid #475569; border-radius: 20px;
      width: 100%; max-width: 340px; padding: 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .acc-avatar {
      width: 72px; height: 72px; border-radius: 50%; border: 3px solid #06c755;
      margin: 0 auto 12px; object-fit: cover; box-shadow: 0 0 15px rgba(6,199,85,0.6);
      background: #0f172a;
    }
    .acc-name { font-size: 1.15rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .acc-id { font-size: 0.75rem; color: #94a3b8; margin-bottom: 20px; word-break: break-all; }
    .btn-acc {
      width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 0.9rem;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 10px; text-decoration: none;
    }
    .btn-acc-line { background: #06c755; color: #fff; }
    .btn-acc-google { background: #fff; color: #1f2937; }
    .btn-acc-logout { background: #ef4444; color: #fff; margin-top: 8px; }
    .btn-acc-close { background: #334155; color: #cbd5e1; }
  </style>
