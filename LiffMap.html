<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🗺️ LINE SQUAD LIVE MAP // แผนที่แก๊งสด</title>

  <!-- 1. LINE LIFF SDK 2.x -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 2. Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* บาร์ด้านบน */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
    }
    .user-profile-badge { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .user-avatar-mini { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #06c755; object-fit: cover; }

    /* ปุ่มลอย */
    .fab-group { position: absolute; right: 12px; top: 65px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .btn-fab {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid #475569;
      background: #1e293b; color: #fff; font-size: 1.2rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    }
    .btn-fab.active { background: #ef4444; border-color: #fff; }

    /* แดชบอร์ดล่าง */
    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
      padding: 10px 14px; border-radius: 16px 16px 0 0; max-height: 200px;
    }
    .target-box {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
      border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .member-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .member-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 6px 8px; min-width: 130px; font-size: 0.72rem; flex-shrink: 0;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .member-card.is-me { border-color: #06c755; background: rgba(6, 199, 85, 0.15); }
    .member-card.is-friend { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .member-card-img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    /* หมุดบนแผนที่ */
    .line-user-pin { text-align: center; }
    .pin-img {
      width: 44px; height: 44px; border-radius: 50%; border: 3px solid #06c755;
      box-shadow: 0 0 14px rgba(6,199,85,0.9); object-fit: cover; background: #000;
    }
    .pin-img.friend-pin { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56,189,248,0.9); }
    .pin-name {
      background: rgba(0,0,0,0.85); color: #fff; font-size: 0.68rem; font-weight: bold;
      padding: 2px 6px; border-radius: 8px; border: 1px solid #06c755; white-space: nowrap;
    }
    .pin-name.friend-name { border-color: #38bdf8; }
  </style>
</head>
<body>

  <!-- บาร์บน -->
  <div class="top-bar">
    <div class="user-profile-badge">
      <img id="myAvatarImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" referrerpolicy="no-referrer" class="user-avatar-mini">
      <span id="myNameText">กำลังเชื่อมต่อ LINE...</span>
    </div>
    <div style="font-size:0.75rem; color:#06c755; font-weight:bold;">
      <span id="gpsStatus">📡 รอพิกัด...</span>
    </div>
  </div>

  <!-- ปุ่มควบคุม -->
  <div class="fab-group">
    <button class="btn-fab" id="btnMyLoc" title="พิกัดของฉัน">📍</button>
    <button class="btn-fab" id="btnSetTarget" title="ปักหมุดจุดนัดพบ">🚩</button>
    <button class="btn-fab" id="btnShareLine" title="แชร์เข้ากลุ่ม LINE">📤</button>
  </div>

  <!-- แผนที่ -->
  <div id="map"></div>

  <!-- รายชื่อแก๊งล่าง -->
  <div class="bottom-panel">
    <div class="target-box">
      <div><b>🚩 นัดพบ:</b> <span id="targetNameDisplay">ยังไม่ได้กำหนด</span></div>
      <span style="font-size:0.7rem; color:#cbd5e1;">(กด 🚩 เพื่อปักหมุด)</span>
    </div>
    <div class="member-scroll" id="memberList"></div>
  </div>

  <script>
    const MY_LIFF_ID = "2012010620-7LrsLOGx";
    
    // 🔥 ใส่ Web App URL ของมึงเรียบร้อยแล้ว!
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwKW0ynRLsyYCGvNs5i87kwRNJBSj79idNalA_r8Nbx8btdi8i_AliZdaAESM1tLS3W/exec";

    let myUserId = localStorage.getItem("SQUAD_UID") || "";
    let myName = localStorage.getItem("SQUAD_UNAME") || "กำลังโหลด...";
    let myAvatar = localStorage.getItem("SQUAD_UAVATAR") || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

    let myLat = 13.7563, myLng = 100.5018;
    let hasGps = false, isTargetMode = false, isProfileReady = false;
    let markers = {}, targetMarker = null, currentTarget = null;

    const map = L.map('map', { zoomControl: false }).setView([myLat, myLng], 14);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ==========================================================================
    // 1. บังคับล็อกอินผ่าน LINE ดึงรูปและชื่อโปรไฟล์จริง 100%
    // ==========================================================================
    async function initLineLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          myUserId = profile.userId;
          myName = profile.displayName;
          myAvatar = profile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

          localStorage.setItem("SQUAD_UID", myUserId);
          localStorage.setItem("SQUAD_UNAME", myName);
          localStorage.setItem("SQUAD_UAVATAR", myAvatar);

          document.getElementById("myNameText").textContent = myName;
          document.getElementById("myAvatarImg").src = myAvatar;

          isProfileReady = true;

          // ถ้า GPS มาแล้ว ให้รีเฟรชหมุดตัวเองเป็นรูปจริงทันที
          if (hasGps) {
            renderMyMarker(myLat, myLng, true);
            syncSquadLocation();
          }
        } else {
          // ถ้ายังไม่ได้ล็อกอิน ให้เด้งไปหน้าล็อกอิน LINE ทันที
          liff.login();
        }
      } catch (err) {
        console.warn("LIFF Error:", err);
        // Fallback กรณีทดสอบบนเบราว์เซอร์ธรรมดานอก LINE
        let fallbackName = localStorage.getItem("SQUAD_UNAME") || prompt("ใส่ชื่อเล่นของคุณ:") || "เพื่อน_สหาย";
        myUserId = myUserId || ("U_TEMP_" + Date.now().toString().slice(-5));
        myName = fallbackName;
        document.getElementById("myNameText").textContent = myName;
        isProfileReady = true;
      }
    }
    initLineLiff();

    // ==========================================================================
    // 2. ปักหมุดรูปโปรไฟล์ตัวเอง (ขอบเขียว)
    // ==========================================================================
    function renderMyMarker(lat, lng, forceUpdateIcon = false) {
      if (!isProfileReady) return;

      const pinHtml = `
        <div class="line-user-pin">
          <span class="pin-name">${myName} (ฉัน)</span><br>
          <img src="${myAvatar}" referrerpolicy="no-referrer" class="pin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        </div>`;

      if (!markers[myUserId]) {
        markers[myUserId] = L.marker([lat, lng], {
          icon: L.divIcon({ html: pinHtml, className: '', iconSize: [44, 55], iconAnchor: [22, 50] }),
          zIndexOffset: 1000
        }).addTo(map);
      } else {
        markers[myUserId].setLatLng([lat, lng]);
        if (forceUpdateIcon) {
          markers[myUserId].setIcon(L.divIcon({ html: pinHtml, className: '', iconSize: [44, 55], iconAnchor: [22, 50] }));
        }
      }
    }

    // ==========================================================================
    // 3. ปักหมุดรูปโปรไฟล์เพื่อนในแก๊ง (ขอบฟ้า)
    // ==========================================================================
    function renderFriendMarker(member) {
      const uid = member.userId;
      const pinHtml = `
        <div class="line-user-pin">
          <span class="pin-name friend-name">${member.name}</span><br>
          <img src="${member.avatar}" referrerpolicy="no-referrer" class="pin-img friend-pin" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        </div>`;

      if (!markers[uid]) {
        markers[uid] = L.marker([member.lat, member.lng], {
          icon: L.divIcon({ html: pinHtml, className: '', iconSize: [44, 55], iconAnchor: [22, 50] })
        }).addTo(map);
      } else {
        markers[uid].setLatLng([member.lat, member.lng]);
        markers[uid].setIcon(L.divIcon({ html: pinHtml, className: '', iconSize: [44, 55], iconAnchor: [22, 50] }));
      }
    }

    // ==========================================================================
    // 4. SYNC พิกัดกับ BACKEND GOOGLE APPS SCRIPT
    // ==========================================================================
    async function syncSquadLocation(pendingTarget) {
      if (!hasGps || !isProfileReady || !BACKEND_URL) return;
      try {
        const payload = {
          userId: myUserId,
          name: myName,
          avatar: myAvatar,
          lat: myLat,
          lng: myLng
        };
        if (pendingTarget) payload.setTarget = pendingTarget;

        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data && data.members) {
          updateRosterAndMap(data.members);
        }
        if (data && data.target) {
          renderTarget(data.target);
        }
      } catch (e) {
        console.warn("Sync error:", e);
      }
    }

    function updateRosterAndMap(membersList) {
      const listEl = document.getElementById("memberList");
      listEl.innerHTML = "";

      // 1. หมุดและการ์ดของตัวเอง
      renderMyMarker(myLat, myLng);
      let myDist = currentTarget ? getDistance(myLat, myLng, currentTarget.lat, currentTarget.lng) : null;
      let myDistText = myDist ? (myDist < 1 ? (myDist * 1000).toFixed(0) + " ม." : myDist.toFixed(1) + " กม.") : "-";

      const myCard = document.createElement("div");
      myCard.className = "member-card is-me";
      myCard.onclick = () => map.setView([myLat, myLng], 16);
      myCard.innerHTML = `
        <img src="${myAvatar}" referrerpolicy="no-referrer" class="member-card-img">
        <div>
          <div><b>${myName}</b> (ฉัน)</div>
          <div style="color:#06c755; font-size:0.65rem;">🎯 ${myDistText}</div>
        </div>`;
      listEl.appendChild(myCard);

      // 2. หมุดและการ์ดของเพื่อนทุกคน
      membersList.forEach(m => {
        if (m.userId === myUserId) return;
        renderFriendMarker(m);

        let dist = currentTarget ? getDistance(m.lat, m.lng, currentTarget.lat, currentTarget.lng) : null;
        let distText = dist ? (dist < 1 ? (dist * 1000).toFixed(0) + " ม." : dist.toFixed(1) + " กม.") : "-";

        const card = document.createElement("div");
        card.className = "member-card is-friend";
        card.onclick = () => map.setView([m.lat, m.lng], 16);
        card.innerHTML = `
          <img src="${m.avatar}" referrerpolicy="no-referrer" class="member-card-img">
          <div>
            <div><b>${m.name}</b></div>
            <div style="color:#38bdf8; font-size:0.65rem;">🎯 ${distText}</div>
          </div>`;
        listEl.appendChild(card);
      });
    }

    // ==========================================================================
    // 5. GPS WATCHER
    // ==========================================================================
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;
        document.getElementById("gpsStatus").textContent = "● GPS สดพร้อม";
        document.getElementById("gpsStatus").style.color = "#06c755";

        if (!hasGps) {
          hasGps = true;
          map.setView([myLat, myLng], 16);
        }
        renderMyMarker(myLat, myLng);
        syncSquadLocation();
      }, (err) => {
        document.getElementById("gpsStatus").textContent = "⚠️ ไม่เปิด GPS";
        document.getElementById("gpsStatus").style.color = "#ef4444";
      }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 });
    }

    // วนลูปดูดพิกัดเพื่อนทุก 4 วินาที
    setInterval(() => {
      syncSquadLocation();
    }, 4000);

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function renderTarget(t) {
      currentTarget = t;
      const label = document.getElementById("targetNameDisplay");
      if (!t || !t.lat) {
        label.textContent = "ยังไม่ได้กำหนด";
        if (targetMarker) map.removeLayer(targetMarker);
        return;
      }
      label.textContent = `${t.name} (โดย: ${t.by})`;
      if (!targetMarker) {
        targetMarker = L.marker([t.lat, t.lng], {
          icon: L.divIcon({ html: '🚩', className: '', iconSize: [32, 32] })
        }).addTo(map);
      } else {
        targetMarker.setLatLng([t.lat, t.lng]);
      }
    }

    document.getElementById("btnMyLoc").onclick = () => {
      if (hasGps) map.setView([myLat, myLng], 16);
    };

    document.getElementById("btnSetTarget").onclick = () => {
      isTargetMode = !isTargetMode;
      document.getElementById("btnSetTarget").classList.toggle("active", isTargetMode);
      if (isTargetMode) alert("📍 แตะบนแผนที่เพื่อตั้งเป้าหมายนัดพบให้ทุกคนเห็น!");
    };

    map.on('click', (e) => {
      if (!isTargetMode) return;
      const name = prompt("🚩 ตั้งชื่อจุดนัดพบนี้:", "จุดนัดพบแก๊ง");
      if (!name) return;
      isTargetMode = false;
      document.getElementById("btnSetTarget").classList.remove("active");

      const newTarget = { name: name, lat: e.latlng.lat, lng: e.latlng.lng, by: myName };
      renderTarget(newTarget);
      syncSquadLocation(newTarget);
    });

    document.getElementById("btnShareLine").onclick = () => {
      const shareUrl = "https://liff.line.me/" + MY_LIFF_ID;
      if (typeof liff !== "undefined" && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([
          { type: "text", text: `🗺️ เปิดดูแผนที่พิกัดแก๊งสด & จุดนัดพบรวม:\n${shareUrl}` }
        ]);
      } else {
        alert("คัดลอกลิงก์ส่งเข้า LINE กลุ่มได้เลย:\n" + shareUrl);
      }
    };
  </script>
</body>
</html>
